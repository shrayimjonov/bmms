    #cors:
    #allowed-origins: "*"
    #allowed-methods: "*"
    #allowed-headers: "*"
    #   exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
    #allow-credentials: true
    #max-age: 1800
  mail:
    from: user@example.com
  #    swagger:
  #        default-include-pattern: /api/.*
  #        title: Bill Master API
  #        description: Bill Master API Documentation
  #        version: 0.1.7
  #        terms-of-service-url:
  #        contact-name: Javlon Eraliyev
  #        contact-url: devops.uz
  #        contact-email: user@example.com
  #        license:
  #        license-url:
  api-docs:
    default-include-pattern: ${server.servlet.context-path:}/api/.*
    management-include-pattern: ${server.servlet.context-path:}/management/.*
    title: Bill Master API
    description: Bill Master API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: ${JHIPSTER_API_DOCS_LICENSE}
    license-url:
  security:
    content-security-policy: "${JHIPSTER_SECURITY_CONTENT_SECURITY_POLICY}"
    oauth2:
      audience:
        - account
        - api://default
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

application:
  abs:
    serviceBeanName: absSimulationService
  simulate-gateway-requests: false
  paynet:
    fromFile: true
    paynetJsonPath: ./paynet.json
  pcRegex:
    UZCARD:
      pan: "8600\\d{12}"
      token: "${APPLICATION_PCREGEX_UZCARD_TOKEN}"
    HUMO:
      pan: "(9860\\d{12})|(555536\\d{10})"
      token: "${APPLICATION_PCREGEX_HUMO_TOKEN}"
    VISA:
      pan: "(460294|490957)\\d{10}"
      token: "${APPLICATION_PCREGEX_VISA_TOKEN}"

bm-upay:
  adapter.impl: V2
  simulate: true
  token: ${BM_UPAY_TOKEN}
  authPassword: 123
  authUserName: 123
  serverUrl: ${BM_UPAY_SERVERURL}

paynet:
  simulation: true
  baseUrl: ${PAYNET_BASEURL}
  username: ${USERNAME}
  password: ${PAYNET_PASSWORD}
  terminalId: ${TERMINALID}
  requireServiceId: true

svgate:
  host: ${SVGATE_HOST}
  impl: simulation
  rootPath: /api/jsonrpc
  username: ${USERNAME}
  password: 1
  connectTimeout: 30000
  connectionRequestTimeout: 30000
  readTimeout: 15000
  panPattern: 8600\d{12}|[1]{16}|1234567890123456|[0]{16}|1234567890123457|1212121212121212|9989989989989989
  banks.[111111]:
    name: Test Bank
    cardBin: 111111
    p2p: true
    merchantId: ${MERCHANTID}
    terminalId: ${TERMINALID}
    port: 0
    commission: 1

pusher:
  host: ${PUSHER_HOST}
  login: ${PUSHER_LOGIN}
  password: 123

card-suite-tieto:
  autoConfig: true
  defaultGroupC: 01
  defaultBankC: 09
  simulate: true
  tieto:
    default:
      name: card-suite-tieto
      wsdlAddress: ${CARD_SUITE_TIETO_TIETO_DEFAULT_WSDLADDRESS}
      portName: Issuing
      username: ${USERNAME}
      password: ${CARD_SUITE_TIETO_TIETO_DEFAULT_PASSWORD}

davr-munis:
  name: davr-munis
  #    endpointUrl:  http://127.0.0.1:8080
  url: ${DAVR_MUNIS_URL}
  simulate: true

entity-state-ui:
  #  name: entity-state-ui-sample
  simulate: false
  packageNames:
    - uz.devops.bmcore.enumeration
    - uz.paykap
    - uz.devops

keycloak-admin:
  server-url: ${KEYCLOAK_ADMIN_SERVER_URL}
  realm: ${REALM}
  clientId: ${KEYCLOAK_ADMIN_CLIENTID}
  clientSecret: ${KEYCLOAK_ADMIN_CLIENTSECRET}
  username: ${USERNAME}
  password: ${KEYCLOAK_ADMIN_PASSWORD}
  resource: false

rateService:
  impl: cbuRateService

bm-payme:
  webSocketClientUsername: user
  webSocketClientPassword: ${BM_PAYME_WEBSOCKETCLIENTPASSWORD}
  paymeSenderSimulate: false
  webSocketClientUrl: ${BM_PAYME_WEBSOCKETCLIENTURL}

ofd-feign:
  ofdms-url: ${OFD_FEIGN_OFDMS_URL}
