        host: localhost
        port: 25
        username: ${USERNAME}
        protocol: smtp
    main:
        allow-bean-definition-overriding: true
    messages:
        basename: i18n/messages
    task:
        execution:
            thread-name-prefix: bmms-task-
            pool:
                core-size: 1
                max-size: 50
                queue-capacity: 10000
        scheduling:
            thread-name-prefix: bmms-scheduling-
            pool:
                size: 1
    thymeleaf:
        mode: HTML
    # Allow SecurityConfiguration to initialize w/o specifying an empty issuer-uri is OK
    security:
        oauth2:
            client:
                provider:
                    oidc:
                        issuer-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI}
                registration:
                    oidc:
                        client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID}
                        client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET}
