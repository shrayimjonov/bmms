server:
    port: 10344
    address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
    clientApp:
        name: 'bmmsApp'
    async:
        core-pool-size: 1
        max-pool-size: 50
        queue-capacity: 10000
    # To test logstash appender
    logging:
        # To test json console appender
        use-json-format: false
        logstash:
            enabled: false
            host: localhost
            port: 5000
            queue-size: 512
    security:
        content-security-policy: "${JHIPSTER_SECURITY_CONTENT_SECURITY_POLICY}"
        oauth2:
            audience:
                - account
                - api://default

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

application:
    ourMfoPattern: ['00491','00850','00954','01060','01063','01074','01097','01098','01109','01123','01166','01187','01192']
    hold:
        maxReholdPercent: 30
    reconciliation:
        enableAuto: false
    abs:
        serviceBeanName: absSimulationService
#        serviceBeanName: fidoAbsService
    #        serviceBeanName: absIsApiService
    paynet:
        baseUrl: null
        fromFile: true
        downloadImages: false
        paynetJsonPath: ./paynet.json
    otp:
        simulation: true
        timeoutSeconds: 100
    sms:
        simulation: true
    transactionVerifier:
        verificationTime: 300000
        yellowDangerCount: 1
        orangeDangerCount: 3
        redDangerCount: 5
        recipients: '998901234567'
        pushType: PHONE
        active: true
    common:
        proxyEnabled: false
    munisAgent:
        munisAnorProviderId: 9999
        anorBankMFo: 00491
        bmMunisAgentUsername: user
        bmMunisAgentPassword: ${APPLICATION_MUNISAGENT_BMMUNISAGENTPASSWORD}
        certificateServiceSimulate: true
    humoDebitGateway:
        eposMerchantId: 0121245
        eposTerminalId: 121245
    simulateSendFileToEmail: false
    defaultEmailTo: ${APPLICATION_DEFAULTEMAILTO}
    defaultEmailFrom: ${APPLICATION_DEFAULTEMAILFROM}
    activeCheckRequestVerifier: true
    #SharedAgentResource.statuses request limit
    multiStatusListSize: 10
    uzcardTokenMap.[1111]: ${APPLICATION_UZCARDTOKENMAP_1111}
    p2pUzcard.virtualCardTokens.[NCI]: ${APPLICATION_P2PUZCARD_VIRTUALCARDTOKENS_NCI}
    pcCreditSettings:
        rivo-creative:
            -   name: 'Anor bank Humo'
                phone: '${APPLICATION_PCCREDITSETTINGS_RIVO_CREATIVE_PHONE}'
                cardBin: 986060
                merchantId: ${MERCHANTID}
                terminalId: ${TERMINALID}
                port: 1234
            -   name: 'Anor bank UzCard'
                phone: '${APPLICATION_PCCREDITSETTINGS_RIVO_CREATIVE_PHONE}'
                cardBin: 860063
                merchantId: ${MERCHANTID}
                terminalId: ${TERMINALID}
                port: 123
        user:
            -   name: 'Kapital bank UzCard'
                phone: '${APPLICATION_PCCREDITSETTINGS_USER_PHONE}'
                cardBin: 860049
                merchantId: ${MERCHANTID}
                terminalId: ${TERMINALID}
                port: 3333
    pcRegex:
        UZCARD:
            pan: "8600\\d{12}"
            token: '${APPLICATION_PCREGEX_UZCARD_TOKEN}'
        HUMO:
            pan: "(9860\\d{12})|(555536\\d{10})"
            token: "${APPLICATION_PCREGEX_HUMO_TOKEN}"
        VISA:
            pan: "(460294|490957)\\d{10}"
            token: "${APPLICATION_PCREGEX_VISA_TOKEN}"
        NCI:
            account: "\\d{5}(000|840)\\d{12}"
        FOREX:
            account: "\\d{5}(840)\\d{12}"
        DEPOSIT:
            account: "(\\d{9})|(^[a-z0-9]+$)|(\\d{14})"
    p2pUzcard:
        replenishFixedDelayMilliseconds: 10800000 # 3 hours
        replenishInitialDelayMilliseconds: 60000 # 1 minute
        virtualCardMap.[NCI]:
            enabled: true
            virtualCardToken: ${APPLICATION_P2PUZCARD_VIRTUALCARDMAP_NCI_VIRTUALCARDTOKEN}
            periodMinutes: 180
            merchantId: ${MERCHANTID}
            terminalId: ${TERMINALID}

pusher:
    url: ${PUSHER_URL}
    username: ${USERNAME}
    password: ${PUSHER_PASSWORD}
    enabled: true
    simulate: true

paynet:
    simulation: true
    baseUrl: ${PAYNET_BASEURL}
    username: ${USERNAME}
    password: ${PAYNET_PASSWORD}
    terminalId: ${TERMINALID}
    requireServiceId: true

hg-plugin:
    agentID: 8
    agentPassword: ${HG_PLUGIN_AGENTPASSWORD}
    simulation: true
    receive: true
    testAccount: ${TESTACCOUNT}
    testPayRetry: false
    testPayRetryCount: 10

cbu:
    impl: sim

bm-paynet:
    impl: RPCv5
    simulate: true
    downloadImages: false
    syncAll: false
    syncWhiteList:
        - UCell
        - Beeline
        - 'Штрафы ГУБДД'
        - 'Yurak Amri'
        - 'Гос-й Налог. Комитет'
    urlParamsBlackList:
        - PAN
        - pan
        - centre_id
        - exp
    paynetJsonPath: 'paynet-rpc-response-27.05.json'
    ignoredRecipientPattern: '.*Paynet.*|.*[Ll]otto.*'
    ignoredServicesPattern: 'Отправка СМС'
    ignoredFieldPattern: 'telefon'
    checkServicePattern: '^(Проверка|Получение).*$'
    dataAdapterImpl: RPCv4 #  XML | JSON | RPC
    gatewayServiceImpl: RPCv5 #  XML | JSON | RPC
    converterType: KEY # KEY | LABEL
    rpc:
        url: ${BM_PAYNET_RPC_URL}
        version: 2.0

