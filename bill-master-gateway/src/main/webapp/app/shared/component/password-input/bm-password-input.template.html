<nz-input-group [nzSuffix]="suffixTemplate" nzSize="large">
  <input nz-input [type]="getInputType()" placeholder="{{placeholder}}" [(ngModel)]="password" [disabled]="disabled"/>
</nz-input-group>
<ng-template #suffixTemplate>
  <i class="cursor-pointer" nz-icon [nzType]="getIconType()" (click)="isVisible = !isVisible"></i>
</ng-template>
