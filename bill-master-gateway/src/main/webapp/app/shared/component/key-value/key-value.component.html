<form (ngSubmit)="submit()">
  <div
    class="form-row align-items-center form-group"
    *ngFor="let group of array.controls; let idx = index"
    [formGroup]="convertGroup(group)"
  >
    <div class="form-group-md col-md-6">
      <input nz-input nzSize="large" formControlName="key" id="key-{{ idx }}" placeholder="{{ 'global.key' | translate }}" auto-focus />
    </div>

    <div class="form-group-md col-md-5">
      <input nz-input nzSize="large" formControlName="value" placeholder="{{ 'global.value' | translate }}" />
    </div>

    <div class="form-group-md col-md-1">
      <button type="button" nz-button nzDanger nzSize="large" (click)="remove(idx)" [hidden]="canPush(idx)">
        <i class="icon-btn" nz-icon nzType="minus"></i>
      </button>
      <button nz-button nzType="primary" nzSize="large" type="submit" [disabled]="group.invalid" [hidden]="!canPush(idx)">
        <i class="icon-btn" nz-icon nzType="plus"></i>
      </button>
    </div>
  </div>
</form>
