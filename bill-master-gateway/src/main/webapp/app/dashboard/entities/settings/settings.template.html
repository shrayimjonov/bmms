<h4 class="mb-3" jhiTranslate="global.menu.account.settings">Settings</h4>

<nz-tabset nzLinkRouter nzSize="large">
  <ng-container *ngFor="let tab of tabs">
    <nz-tab *jhiHasAnyAuthority="tab.authorities">
      <a class="d-flex align-items-center" *nzTabLink nz-tab-link routerLink="{{ tab.routerLink }}">
        <i nz-icon nzType="{{ tab.icon }}"></i>
        <span jhiTranslate="{{ tab.title }}">{{ tab.title }}</span>
      </a>
    </nz-tab>
  </ng-container>
</nz-tabset>

<div class="mt-2">
  <router-outlet></router-outlet>
</div>
