<div class="w-400px">
  <bm-alert></bm-alert>

  <form [formGroup]="editForm" (ngSubmit)="save()">
    <div class="form-group">
      <label for="currentPassword" jhiTranslate="global.form.currentpassword.label">Current
        password</label>
      <bm-password-input id="currentPassword" placeholder="{{ 'global.form.currentpassword.placeholder' | translate }}"
                         formControlName="currentPassword" input-validator>
      </bm-password-input>
    </div>

    <div class="form-group">
      <label for="newPassword" jhiTranslate="global.form.newpassword.label">New password</label>
      <bm-password-input id="newPassword" placeholder="{{ 'global.form.newpassword.placeholder' | translate }}"
                         formControlName="newPassword" input-validator>
      </bm-password-input>
    </div>

    <div class="form-group">
      <label for="confirmPassword" jhiTranslate="global.form.confirmpassword.label">New password
        confirmation</label>
      <bm-password-input id="confirmPassword" placeholder="{{ 'global.form.confirmpassword.placeholder' | translate }}"
                         formControlName="confirmPassword" input-validator>
      </bm-password-input>
    </div>

    <button class="mt-2" nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'password.form.button' | translate }}
    </button>
  </form>
</div>
