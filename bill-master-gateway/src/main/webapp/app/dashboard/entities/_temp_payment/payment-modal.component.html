<form [formGroup]="editForm" (ngSubmit)="save()">
  <div class="modal-header">
    <h6 class="modal-title col-12 font-weight-bold text-center p-0 pl-4">
      {{ recipient.titles[lang] }}
      <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="activeModal.dismiss('close')">&times;</button>
    </h6>
  </div>

  <div class="modal-body">
    <!--Logo-->
    <div class="row align-items-center justify-content-around mb-4">
      <img
        src="{{ paymentService.getRecipientLogoUrl(recipient.logo) }}"
        nz-tooltip="{{ recipient.fullNames[lang] }}"
        alt="image"
        width="auto"
        height="80"
        image-loader
      />
    </div>

    <bm-alert></bm-alert>

    <div class="form-group" *ngFor="let field of recipient.fields | sortBy: 'ord'">
      <div *ngIf="hasRequiredField(field)" [@fadeInAnimation]>
        <label nz-tooltip="{{ field.descriptions[lang] }}">{{ field.titles[lang] }}</label>

        <div [ngSwitch]="field.type" [@fadeInAnimation]>
          <!--Select-->
          <ng-container *ngSwitchCase="type.OTHER">
            <nz-select nzSize="large" formControlName="{{ field.name }}" (ngModelChange)="resetRequiredFieldValue(field)">
              <nz-option
                *ngFor="let fieldValue of field.values"
                nzLabel="{{ fieldValue.titles[lang] }}"
                [nzValue]="fieldValue.value"
                [nzHide]="hideNotRequiredFieldValue(field.requireField, fieldValue)"
              >
              </nz-option>
            </nz-select>
          </ng-container>

          <!--Amount-->
          <ng-container *ngSwitchCase="type.AMOUNT">
            <input
              nz-input
              nzSize="large"
              formControlName="{{ field.name }}"
              mask="separator.2"
              autocomplete="off"
              placeholder="{{ amountPlaceholderRef.elementRef.nativeElement.innerHTML }}"
            />
          </ng-container>

          <!--Amount placeholder-->
          <ng-template
            #amountPlaceholderRef
            jhiTranslate="payment.amountRange"
            [translateValues]="{ min: recipient.minAmount | bmAmount, max: recipient.maxAmount | bmAmount }"
          >
          </ng-template>

          <!--Text-->
          <ng-container *ngSwitchDefault>
            <input nz-input nzSize="large" formControlName="{{ field.name }}" />
          </ng-container>

          <!--Errors-->
          <div *ngIf="hasError(field)" [@fadeInAnimation]>
            <small class="form-text text-danger d-grid">
              <!--Required-->
              <span *ngIf="editForm.get(field.name).errors.required" jhiTranslate="entity.validation.required">
                This field is required.
              </span>

              <!--Min length-->
              <span
                *ngIf="editForm.get(field.name).errors.minlength"
                jhiTranslate="entity.validation.minlength"
                [translateValues]="{ min: field.lengthMin }"
              >
                This field cannot be less than "n" characters.
              </span>

              <!--Max length-->
              <span
                *ngIf="editForm.get(field.name).errors.maxlength"
                jhiTranslate="entity.validation.maxlength"
                [translateValues]="{ max: field.lengthMax }"
              >
                This field cannot be longer than "n" characters.
              </span>

              <!--Min-->
              <span
                *ngIf="editForm.get(field.name).errors.min"
                jhiTranslate="entity.validation.min"
                [translateValues]="{ min: getMin(field) | bmAmount }"
              >
                This field should be at least "n"
              </span>

              <!--Max-->
              <span
                *ngIf="editForm.get(field.name).errors.max"
                jhiTranslate="entity.validation.max"
                [translateValues]="{ max: getMax(field) | bmAmount }"
              >
                This field cannot be more than "n"
              </span>

              <!--Pattern-->
              <span
                *ngIf="editForm.get(field.name).errors.pattern"
                jhiTranslate="entity.validation.pattern"
                [translateValues]="{ pattern: field.validation }"
              >
                This field should follow pattern for "n"
              </span>
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [disabled]="editForm.invalid">
      {{ 'entity.action.pay' | translate }}
    </button>
  </div>
</form>
