<form [formGroup]="editForm" (ngSubmit)="save()">
  <div class="modal-header">
    <h5 class="modal-title" jhiTranslate="billMasterGwApp.pkbillmsP2PCondition.home.createOrEditLabel">Create or edit a P 2 P Condition</h5>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeModal()">&times;</button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>
    <div class="form-group">
      <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsP2PCondition.value" for="field_value">Value</label>
      <input nz-input nzSize="large" formControlName="value" id="field_value" input-validator auto-focus />
    </div>

    <div class="form-group">
      <label jhiTranslate="billMasterGwApp.pkbillmsP2PCondition.description" for="field_description">description</label>
      <textarea nz-input rows="3" id="field_description" formControlName="description"></textarea>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" nzType="text" jhiTranslate="entity.action.cancel" (click)="closeModal()">
      Cancel
    </button>
    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
