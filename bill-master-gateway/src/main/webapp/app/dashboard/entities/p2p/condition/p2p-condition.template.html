<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="mb-0" jhiTranslate="global.menu.entities.pkbillmsP2PCondition">P2P Conditions</h5>

  <div>
    <nz-badge [nzCount]="filterRef.querySize">
      <button nz-button nzSize="large" jhiTranslate="entity.action.filter" (click)="showFilter = !showFilter">Filter</button>
    </nz-badge>

    <ngl-export-as
      *ngIf="data?.length"
      class="ml-2"
      [data]="data"
      requestUrl="{{ p2pConditionService.resourceUrl }}"
      [requestOption]="getOption"
      translationPrefix="billMasterGwApp.pkbillmsP2PCondition"
      fileName="p2p_conditions"
    >
    </ngl-export-as>

    <button
      class="ml-2"
      type="button"
      nz-button
      nzSize="large"
      nzType="primary"
      jhiTranslate="entity.action.add"
      *jhiHasAnyAuthority="[authority.P2P_CONDITION_WRITE]"
      (click)="p2pConditionService.openUpdate()"
    >
      Add
    </button>
  </div>
</div>

<ngl-filter-field [hidden]="!showFilter" [fields]="filterFields" (onFilter)="setQuery($event); loadPage()" #filterRef></ngl-filter-field>

<bm-alert></bm-alert>

<ng-container *ngIf="data?.length">
  <div class="table-responsive">
    <nz-table nzSize="small" [nzLoading]="loading" nzTemplateMode nzOuterBordered>
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" [callback]="loadPage.bind(this)">
          <th jhiSortBy="id">
            <span jhiTranslate="global.field.id">ID</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="value">
            <span jhiTranslate="billMasterGwApp.pkbillmsP2PCondition.value">Value</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="description">
            <span jhiTranslate="billMasterGwApp.pkbillmsP2PCondition.description">Description</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p2pCondition of data; trackBy: trackId">
          <td>
            <a href="javascript:void(0)" (click)="p2pConditionService.openView(p2pCondition)">{{ p2pCondition.id }}</a>
          </td>
          <td>{{ p2pCondition.value }}</td>
          <td>{{ p2pCondition.description }}</td>
          <td width="10" class="text-right">
            <nz-button-group nzSize="small">
              <button
                nz-button
                (click)="p2pConditionService.openHistory(p2pCondition.id)"
                title="{{ 'entity.action.history' | translate }}"
              >
                <i nz-icon nzType="history" class="icon-btn"></i>
              </button>
              <button
                (click)="p2pConditionService.openView(p2pCondition)"
                nzType="default"
                nz-button
                title="{{ 'entity.action.view' | translate }}"
              >
                <i nz-icon nzType="eye" class="icon-btn"></i>
              </button>
              <ng-container *jhiHasAnyAuthority="[authority.P2P_CONDITION_WRITE]">
                <button
                  nz-button
                  (click)="p2pConditionService.openUpdate(p2pCondition, true)"
                  title="{{ 'entity.action.duplicate' | translate }}"
                >
                  <i nz-icon nzType="copy" class="icon-btn"></i>
                </button>
                <button nz-button (click)="p2pConditionService.openUpdate(p2pCondition)" title="{{ 'entity.action.edit' | translate }}">
                  <i nz-icon nzType="edit" class="icon-btn"></i>
                </button>
                <button
                  nz-button
                  (click)="p2pConditionService.openDelete(p2pCondition.id)"
                  title="{{ 'entity.action.delete' | translate }}"
                >
                  <i nz-icon nzType="delete" class="icon-btn"></i>
                </button>
              </ng-container>
            </nz-button-group>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>

  <div class="d-flex justify-content-center mt-3">
    <nz-pagination
      [nzPageIndex]="ngbPaginationPage"
      [nzTotal]="totalItems"
      [nzPageSize]="itemsPerPage"
      (nzPageIndexChange)="loadPage($event)"
    >
    </nz-pagination>
  </div>
</ng-container>
