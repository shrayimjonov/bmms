<nz-spin [nzSpinning]="loading" [nzDelay]="0" nzSize="large">
  <form [formGroup]="testForm" (ngSubmit)="test()">
    <div class="modal-header">
      <h5 class="modal-title" jhiTranslate="entity.action.test">Test</h5>
      <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="activeModal.dismiss()">&times;</button>
    </div>
    <div class="modal-body">
      <bm-alert></bm-alert>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsP2PParam.senderPc">Sender Pc</label>
          <bm-select-input [data]="payTypes" formControlName="senderPc" [bmOptionOverflowSize]="12" (ngModelChange)="senderAccountRef.focus()"></bm-select-input>
        </div>

        <div class="form-group col-md-6">
          <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsTransaction.senderAccount">Sender Account</label>
          <input nz-input nzSize="large" formControlName="senderAccount" input-validator #senderAccountRef/>
        </div>

        <div class="form-group col-md-6">
          <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsP2PParam.recipientPc">Recipient Pc</label>
          <bm-select-input [data]="payTypes" formControlName="recipientPc" [bmOptionOverflowSize]="12" (ngModelChange)="recipientAccount.focus()"></bm-select-input>
        </div>

        <div class="form-group col-md-6">
          <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsTransaction.recipientAccount">Recipient Account</label>
          <input nz-input nzSize="large" formControlName="recipientAccount" input-validator #recipientAccount/>
        </div>

          <div class="form-group col-md-12">
            <label jhiTranslate="billMasterGwApp.pkbillmsP2PParam.promo">Promo</label>
            <input nz-input nzSize="large" formControlName="promo" input-validator />
          </div>

        <div class="col-md-12">
          <pre class="json-result" *ngIf="result">{{ result | json }}</pre>
        </div>
      </div>
    </div>


    <div class="modal-footer">
      <button
        type="button"
        nz-button
        nzSize="large"
        nzType="text"
        data-dismiss="modal"
        jhiTranslate="entity.action.cancel"
        (click)="activeModal.dismiss()"
      >
        Cancel
      </button>
      <button nz-button nzSize="large" nzType="primary" [disabled]="testForm.invalid" [nzLoading]="loading">
        {{ 'entity.action.test' | translate }}
      </button>
    </div>
  </form>
</nz-spin>
