<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="mb-0" jhiTranslate="global.menu.entities.pkbillmsP2PCommission">P2P Commissions</h5>

  <div>
    <nz-badge [nzCount]="filterRef.querySize">
      <button nz-button nzSize="large" jhiTranslate="entity.action.filter" (click)="showFilter = !showFilter">Filter</button>
    </nz-badge>

    <ngl-export-as
      *ngIf="data?.length"
      class="ml-2"
      [data]="data"
      requestUrl="{{ p2pCommissionService.resourceUrl }}"
      [requestOption]="getOption"
      translationPrefix="billMasterGwApp.pkbillmsP2PCommission"
      fileName="p2p_commissions"
    >
    </ngl-export-as>

    <button
      class="ml-2"
      type="button"
      nz-button
      nzSize="large"
      nzType="primary"
      jhiTranslate="entity.action.add"
      *jhiHasAnyAuthority="[authority.P2P_COMMISSION_WRITE]"
      (click)="p2pCommissionService.openUpdate()"
    >
      Add
    </button>
  </div>
</div>

<ngl-filter-field [hidden]="!showFilter" [fields]="filterFields" (onFilter)="setQuery($event); loadPage()" #filterRef></ngl-filter-field>

<bm-alert></bm-alert>

<ng-container *ngIf="data?.length">
  <div class="table-responsive">
    <nz-table [nzLoading]="loading" nzSize="small" nzTemplateMode nzOuterBordered>
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" [callback]="loadPage.bind(this)">
          <th jhiSortBy="id">
            <span jhiTranslate="global.field.id">ID</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="name">
            <span jhiTranslate="billMasterGwApp.pkbillmsP2PCommission.name">Name</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="fee">
            <span jhiTranslate="billMasterGwApp.pkbillmsP2PCommission.fee">Fee</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="up">
            <span jhiTranslate="billMasterGwApp.pkbillmsP2PCommission.up">Up</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="down">
            <span jhiTranslate="billMasterGwApp.pkbillmsP2PCommission.down">Down</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="description">
            <span jhiTranslate="billMasterGwApp.pkbillmsP2PCommission.description">Description</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p2pCommission of data; trackBy: trackId">
          <td>
            <a href="javascript:void(0)" (click)="p2pCommissionService.openView(p2pCommission)">{{ p2pCommission.id }}</a>
          </td>
          <td>{{ p2pCommission.name }}</td>
          <td>{{ p2pCommission.fee }}</td>
          <td>{{ p2pCommission.up }}</td>
          <td>{{ p2pCommission.down }}</td>
          <td>{{ p2pCommission.description }}</td>
          <td width="10" class="text-right">
            <nz-button-group nzSize="small">
              <button
                nz-button
                (click)="p2pCommissionService.openHistory(p2pCommission.id)"
                title="{{ 'entity.action.history' | translate }}"
              >
                <i nz-icon nzType="history" class="icon-btn"></i>
              </button>
              <button
                type="submit"
                (click)="p2pCommissionService.openView(p2pCommission)"
                nzType="default"
                nz-button
                title="{{ 'entity.action.view' | translate }}"
              >
                <i nz-icon nzType="eye" class="icon-btn"></i>
              </button>
              <ng-container *jhiHasAnyAuthority="[authority.P2P_COMMISSION_WRITE]">
                <button
                  nz-button
                  (click)="p2pCommissionService.openUpdate(p2pCommission, true)"
                  title="{{ 'entity.action.duplicate' | translate }}"
                >
                  <i nz-icon nzType="copy" class="icon-btn"></i>
                </button>
                <button
                  type="submit"
                  nz-button
                  (click)="p2pCommissionService.openUpdate(p2pCommission)"
                  title="{{ 'entity.action.edit' | translate }}"
                >
                  <i nz-icon nzType="edit" class="icon-btn"></i>
                </button>
                <button
                  type="submit"
                  nz-button
                  (click)="p2pCommissionService.openDelete(p2pCommission.id)"
                  title="{{ 'entity.action.delete' | translate }}"
                >
                  <i nz-icon nzType="delete" class="icon-btn"></i>
                </button>
              </ng-container>
            </nz-button-group>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>

  <div class="d-flex justify-content-center mt-3">
    <nz-pagination
      [nzPageIndex]="ngbPaginationPage"
      [nzTotal]="totalItems"
      [nzPageSize]="itemsPerPage"
      (nzPageIndexChange)="loadPage($event)"
    >
    </nz-pagination>
  </div>
</ng-container>
