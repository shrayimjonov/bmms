<form [formGroup]="editForm" (ngSubmit)="save()">
  <div class="modal-header">
    <h5 class="modal-title" jhiTranslate="billMasterGwApp.pkbillmsP2PAgentParam.home.createOrEditLabel">
      Create or edit a P 2 P Condition
    </h5>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeModal()">&times;</button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>
    <div class="form-group">
      <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsP2PAgentParam.agentId" for="field_agentId">agentId</label>
      <input nz-input nzSize="large" formControlName="agentId" id="field_agentId" input-validator auto-focus />
    </div>

    <div class="form-group">
      <label for="field_p2pParamsRegex">
        {{ 'billMasterGwApp.pkbillmsP2PAgentParam.p2pParamsRegex' | translate }}
        <span nz-icon nzType="info-circle" nzTheme="outline" (click)="routeRegexSite()"></span>
      </label>

      <nz-input-group [nzSuffix]="suffixTemplateInfo">
        <input nz-input id="field_p2pParamsRegex" formControlName="p2pParamsRegex" />
      </nz-input-group>
      <ng-template #suffixTemplateInfo>
        <button nz-button nzSize="small" type="button" (click)="regexTest()">Test</button>
      </ng-template>
    </div>

    <div class="form-row">
      <div class="form-group col-md-3">
        <label jhiTranslate="billMasterGwApp.pkbillmsSetting.active" for="field_active">active</label>
        <br />
        <nz-switch id="field_active" formControlName="active"></nz-switch>
      </div>

      <div class="form-group col-md-9">
        <label jhiTranslate="billMasterGwApp.pkbillmsP2PAgentParam.description" for="field_description">description</label>
        <textarea nz-input id="field_description" formControlName="description"></textarea>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" nzType="text" jhiTranslate="entity.action.cancel" (click)="closeModal()">Cancel</button>
    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
