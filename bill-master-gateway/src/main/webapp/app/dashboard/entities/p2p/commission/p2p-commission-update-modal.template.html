<form [formGroup]="editForm" (ngSubmit)="save()">
  <div class="modal-header">
    <h5 class="modal-title" jhiTranslate="billMasterGwApp.pkbillmsP2PCommission.home.createOrEditLabel">
      Create or edit a P 2 P Commission
    </h5>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeModal()">&times;</button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>

    <div class="form-group">
      <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsP2PCommission.name" for="field_name">Name</label>
      <input nz-input nzSize="large" formControlName="name" id="field_name" input-validator auto-focus />
    </div>

    <div class="form-row">
      <div class="form-group col-md-4">
        <label jhiTranslate="billMasterGwApp.pkbillmsP2PCommission.up" for="field_up">Up</label>
        <input type="number" nz-input nzSize="large" formControlName="up" id="field_up" input-validator />
      </div>
      <div class="form-group col-md-4">
        <label jhiTranslate="billMasterGwApp.pkbillmsP2PCommission.down" for="field_down">down</label>
        <input type="number" nz-input nzSize="large" formControlName="down" id="field_down" input-validator />
      </div>
      <div class="form-group col-md-4">
        <label jhiTranslate="billMasterGwApp.pkbillmsP2PCommission.fee" for="field_fee">fee</label>
        <input type="number" nz-input nzSize="large" formControlName="fee" id="field_fee" input-validator />
      </div>
    </div>
    <div class="form-group">
      <label jhiTranslate="billMasterGwApp.pkbillmsP2PCommission.description" for="field_description">description</label>
      <textarea nz-input rows="3" id="field_description" formControlName="description"></textarea>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" nzType="text" jhiTranslate="entity.action.cancel" (click)="closeModal()">
      Cancel
    </button>
    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
