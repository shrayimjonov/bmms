<form [formGroup]="editForm" (ngSubmit)="onSubmit()">
  <div class="modal-header">
    <h4 class="modal-title" jhiTranslate="billMasterGwApp.pkbillmsAgent.home.createOrEditLabel">Create Or Edit Label</h4>

    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeModal()">&times;</button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsAgent.shortName" for="field_shortName">Short Name</label>
        <input nz-input nzSize="large" formControlName="shortName" id="field_shortName" input-validator auto-focus />
      </div>
      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.pkbillmsAgent.phoneNumber" for="field_phoneNumber">Phone Number</label>
        <input
          nz-input
          nzSize="large"
          id="field_phoneNumber"
          formControlName="phoneNumber"
          placeholder="+998 XX XXX XX XX"
          mask="+000 00 000 00 00"
          autocomplete="off"
          input-validator
        />
      </div>
      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsAgent.email" for="field_email">Email</label>
        <input type="email" nz-input nzSize="large" id="field_email" formControlName="email" email input-validator />
      </div>
      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsAgent.apiKey" for="field_apiKey">Api Key</label>
        <input nz-input nzSize="large" formControlName="apiKey" id="field_apiKey" input-validator />
      </div>
      <div class="form-group col-md-12">
        <label jhiTranslate="billMasterGwApp.pkbillmsAgent.orgName" for="field_orgName">Org Name</label>
        <input nz-input nzSize="large" id="field_orgName" formControlName="orgName" />
      </div>
      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.pkbillmsAgent.inn" for="field_inn">INN</label>
        <input
          nz-input
          nzSize="large"
          id="field_inn"
          formControlName="inn"
          placeholder="000000000"
          mask="000000000"
          autocomplete="off"
          input-validator
        />
      </div>
      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.pkbillmsAgent.currencies" for="field_currencies">Currencies</label>
        <bm-select-input
          id="field_currencies"
          bmMode="multiple"
          [bmMaxTagCount]="0"
          [bmShowSearch]="false"
          [data]="currencies"
          bmLabelField="label"
          bmValueField="value"
          formControlName="currencies"
          input-validator>
        </bm-select-input>
      </div>
      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsAgent.amountRatio" for="field_amountRatio">Amount Ratio</label>
        <bm-select-input
          id="field_amountRatio"
          [data]="amountRatios"
          bmLabelField="label"
          bmValueField="value"
          formControlName="amountRatio"
          input-validator
        >
        </bm-select-input>
      </div>
      <div class="form-group col-md-6" *ngIf="!data?.id">
        <label jhiTranslate="global.field.password" for="field_password">Password</label>
        <bm-password-input id="field_password" formControlName="password" input-validator></bm-password-input>
      </div>
    </div>
    <div>
      <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsAgent.title">Titles</label>
      <bm-i18n-input formControlName="titles" [duplicate]="duplicate" input-validator></bm-i18n-input>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" nzType="text" jhiTranslate="entity.action.cancel" (click)="closeModal()">
      Cancel
    </button>

    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
