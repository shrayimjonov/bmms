<form [formGroup]="editForm" (ngSubmit)="save()">
  <div class="modal-header">
    <h5 class="modal-title" jhiTranslate="billMasterGwApp.pkbillmsSetting.home.createOrEditLabel">Create or edit a Setting</h5>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeModal()">&times;</button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsSetting.shortName" for="field_shortName">Short Name</label>
        <input nz-input nzSize="large" formControlName="shortName" id="field_shortName" input-validator auto-focus />
      </div>

      <div class="form-group col-md-3">
        <label jhiTranslate="billMasterGwApp.pkbillmsSetting.ord">Ord</label>
        <input nz-input type="number" nzSize="large" formControlName="ord" id="field_ord" />
      </div>

      <div class="form-group col-md-3">
        <label jhiTranslate="billMasterGwApp.pkbillmsSetting.parentSettingId">parentSettingId</label>
        <bm-select-input
          [requestUrl]="settingService.resourceParentUrl"
          bmLabelField="shortName"
          bmValueField="id"
          formControlName="parentSettingId"
        ></bm-select-input>
      </div>
    </div>

    <div class="form-group">
      <label class="label-required" for="field_props" jhiTranslate="billMasterGwApp.pkbillmsSetting.prop">Props</label>
      <prop-form id="field_props" formControlName="props" input-validator></prop-form>
    </div>

    <nz-switch
      id="field_active"
      formControlName="active"
      nzCheckedChildren="{{ 'global.active.true' | translate }}"
      nzUnCheckedChildren="{{ 'global.active.false' | translate }}"
    >
    </nz-switch>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" nzType="text" jhiTranslate="entity.action.cancel" (click)="closeModal()">Cancel</button>
    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
