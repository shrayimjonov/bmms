<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0" jhiTranslate="global.menu.entities.pkbillmsSetting">Settings</h4>

  <div>
    <nz-badge [nzCount]="filterRef.querySize">
      <button nz-button nzSize="large" jhiTranslate="entity.action.filter" (click)="showFilter = !showFilter">Filter</button>
    </nz-badge>

    <ngl-export-as
      *ngIf="data?.length"
      class="ml-2"
      [data]="data"
      requestUrl="{{ settingService.resourceUrl }}"
      [requestOption]="getOption"
      [exclude]="['props']"
      translationPrefix="billMasterGwApp.pkbillmsSetting"
      fileName="agent-recipient-setting"
    >
    </ngl-export-as>

    <button
      class="ml-2"
      type="button"
      nz-button
      nzSize="large"
      nzType="primary"
      jhiTranslate="entity.action.add"
      *jhiHasAnyAuthority="[authority.AGENT_RECIPIENT_SETTING_WRITE]"
      (click)="settingService.openUpdate()"
    >
      Add
    </button>
  </div>
</div>

<ngl-filter-field [hidden]="!showFilter" [fields]="filterFields" (onFilter)="setQuery($event); loadPage()" #filterRef></ngl-filter-field>

<bm-alert></bm-alert>

<ng-container *ngIf="data?.length">
  <div class="table-responsive">
    <nz-table [nzLoading]="loading" nzSize="small" nzTemplateMode nzOuterBordered>
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" [callback]="loadPage.bind(this)">
          <th jhiSortBy="id">
            <span jhiTranslate="global.field.id">ID</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="shortName">
            <span jhiTranslate="billMasterGwApp.pkbillmsSetting.shortName">Short Name</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="ord">
            <span jhiTranslate="billMasterGwApp.pkbillmsSetting.ord">Ord</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="active">
            <span jhiTranslate="billMasterGwApp.pkbillmsSetting.active">Active</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let setting of data; trackBy: trackId">
          <td>
            <a href="javascript:void(0)" (click)="settingService.openView(setting)">{{ setting.id }}</a>
          </td>
          <td>{{ setting.shortName }}</td>
          <td>{{ setting.ord }}</td>
          <td>
            <span [bm-boolean-badge]="setting.active" bmType="active">{{ setting.active }}</span>
          </td>
          <td width="10" class="text-right">
            <nz-button-group nzSize="small">
              <button nz-button (click)="settingService.openHistory(setting.id)" title="{{ 'entity.action.history' | translate }}">
                <i nz-icon nzType="history" class="icon-btn"></i>
              </button>
              <button nz-button (click)="settingService.openView(setting)" title="{{ 'entity.action.view' | translate }}">
                <i nz-icon nzType="eye" class="icon-btn"></i>
              </button>
              <ng-container *jhiHasAnyAuthority="[authority.AGENT_RECIPIENT_SETTING_WRITE]">
                <button nz-button (click)="settingService.openUpdate(setting, true)" title="{{ 'entity.action.duplicate' | translate }}">
                  <i nz-icon nzType="copy" class="icon-btn"></i>
                </button>
                <button nz-button (click)="settingService.openUpdate(setting)" title="{{ 'entity.action.edit' | translate }}">
                  <i nz-icon nzType="edit" class="icon-btn"></i>
                </button>
                <button nz-button (click)="settingService.openDelete(setting.id)" title="{{ 'entity.action.delete' | translate }}">
                  <i nz-icon nzType="delete" class="icon-btn"></i>
                </button>
              </ng-container>
            </nz-button-group>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>

  <div class="d-flex justify-content-center mt-3">
    <nz-pagination
      [nzPageIndex]="ngbPaginationPage"
      [nzTotal]="totalItems"
      [nzPageSize]="itemsPerPage"
      (nzPageIndexChange)="loadPage($event)"
    >
    </nz-pagination>
  </div>
</ng-container>
