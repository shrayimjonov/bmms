<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0" jhiTranslate="global.menu.entities.pkbillmsDeposit">Deposits</h4>

  <div>
    <nz-badge [nzCount]="filterRef.querySize">
      <button nz-button nzSize="large" jhiTranslate="entity.action.filter" (click)="showFilter = !showFilter">Filter</button>
    </nz-badge>

    <ngl-export-as
      *ngIf="data?.length"
      class="ml-2"
      [data]="data"
      requestUrl="{{ depositService.resourceUrl }}"
      [requestOption]="getOption"
      translationPrefix="billMasterGwApp.pkbillmsDeposit"
      fileName="deposits"
    >
    </ngl-export-as>
  </div>
</div>

<ngl-filter-field [hidden]="!showFilter" [fields]="filterFields" (onFilter)="setQuery($event); loadPage()" #filterRef></ngl-filter-field>

<bm-alert></bm-alert>

<div class="table-responsive" *ngIf="data?.length">
  <nz-table [nzLoading]="loading" nzSize="small" nzTemplateMode nzOuterBordered>
    <thead>
      <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" [callback]="loadPage.bind(this)">
        <th jhiSortBy="id">
          <span jhiTranslate="global.field.id">ID</span>
          <sort-icon icon="sort"></sort-icon>
        </th>
        <th jhiSortBy="agent">
          <span jhiTranslate="billMasterGwApp.pkbillmsDeposit.agent">Agent</span>
          <sort-icon icon="sort"></sort-icon>
        </th>
        <th jhiSortBy="overdraftLimit">
          <span jhiTranslate="billMasterGwApp.pkbillmsDeposit.overdraftLimit">Overdraft Limit</span>
          <sort-icon icon="sort"></sort-icon>
        </th>
        <th jhiSortBy="balance">
          <span jhiTranslate="billMasterGwApp.pkbillmsDeposit.balance">Balance</span>
          <sort-icon icon="sort"></sort-icon>
        </th>
        <th jhiSortBy="balanceCcy">
          <span jhiTranslate="billMasterGwApp.pkbillmsDeposit.balanceCcy">Balance Ccy</span>
          <sort-icon icon="sort"></sort-icon>
        </th>
        <th jhiSortBy="blocked">
          <span jhiTranslate="billMasterGwApp.pkbillmsDeposit.blocked">Blocked</span>
          <sort-icon icon="sort"></sort-icon>
        </th>
        <th jhiSortBy="unlimit">
          <span jhiTranslate="billMasterGwApp.pkbillmsDeposit.unlimit">Unlimit</span>
          <sort-icon icon="sort"></sort-icon>
        </th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let deposit of data; trackBy: trackId">
        <td>
          <a href="javascript:void(0)" (click)="depositService.openView(deposit)">{{ deposit.id }}</a>
        </td>
        <td>
          <div *ngIf="deposit.agent">
            <a href="javascript:void(0)" (click)="agentService.openView(deposit.agent)">{{ deposit.agent.shortName }}</a>
          </div>
        </td>
        <td>{{ deposit.overdraftLimit }}</td>
        <td>{{ deposit.balance }}</td>
        <td>{{ deposit.balanceCcy }}</td>
        <td>
          <span [ngClass]="{ 'badge badge-danger': deposit.blocked }">{{ deposit.blocked }}</span>
        </td>
        <td>
          <span [ngClass]="{ 'badge badge-warning': deposit.unlimit }">{{ deposit.unlimit }}</span>
        </td>
        <td width="10" class="text-right">
          <nz-button-group nzSize="small">
            <button nz-button (click)="viewDepositTransactions(deposit.agent.shortName)">
              {{'global.menu.entities.pkbillmsTransaction' | translate | lowercase}}
            </button>
            <button nz-button (click)="depositService.openHistory(deposit.id)" title="{{ 'entity.action.history' | translate }}">
              <i nz-icon nzType="history" class="icon-btn"></i>
            </button>
            <button nz-button (click)="depositService.openView(deposit)" title="{{ 'entity.action.view' | translate }}">
              <i nz-icon nzType="eye" class="icon-btn"></i>
            </button>

            <ng-container *jhiHasAnyAuthority="[authority.DEPOSIT_WRITE]">
              <button nz-button (click)="depositService.openReplenish(deposit)" title="{{ 'entity.action.fill' | translate }}">
                <i nz-icon nzType="plus" class="icon-btn"></i>
              </button>
              <!--              <button nz-button (click)="depositService.openDelete(deposit.id)" title="{{ 'entity.action.delete' | translate }}">-->
              <!--                <i nz-icon nzType="delete" class="icon-btn"></i>-->
              <!--              </button>-->
            </ng-container>
          </nz-button-group>
        </td>
      </tr>
    </tbody>
  </nz-table>
</div>

<div class="d-flex justify-content-center mt-3">
  <nz-pagination
    [nzPageIndex]="ngbPaginationPage"
    [nzTotal]="totalItems"
    [nzPageSize]="itemsPerPage"
    (nzPageIndexChange)="loadPage($event)"
  >
  </nz-pagination>
</div>
