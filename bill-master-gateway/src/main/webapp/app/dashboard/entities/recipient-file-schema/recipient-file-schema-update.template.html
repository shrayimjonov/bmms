<form [formGroup]="editForm" (ngSubmit)="save()">
  <div class="modal-header">
    <h4 class="modal-title" jhiTranslate="billMasterGwApp.bmmsRecipientFileSchema.home.createOrEditLabel">Create Or Edit
      Label</h4>

    <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
            (click)="closeModal()">&times;
    </button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>

    <div class="form-row">

      <div class="form-group col-md-12">
        <label class="label-required" jhiTranslate="billMasterGwApp.bmmsRecipientFileSchema.name"
               for="field_name">Name</label>
        <input nz-input nzSize="large" formControlName="name" id="field_name">
      </div>

      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.bmmsRecipientFileSchema.idList" for="field_idList">Id
          List</label>
        <input nz-input nzSize="large" formControlName="idList" id="field_idList">
      </div>

      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.bmmsRecipientFileSchema.root" for="field_root">Root</label>
        <input nz-input nzSize="large" formControlName="root" id="field_root">
      </div>

    </div>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" jhiTranslate="entity.action.cancel" (click)="closeModal()">
      Cancel
    </button>

    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading"
            [disabled]="editForm.invalid">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
