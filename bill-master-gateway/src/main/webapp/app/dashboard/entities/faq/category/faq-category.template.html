<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0" jhiTranslate="global.menu.entities.faqCategory">FAQ-Category</h4>

  <button
    type="button"
    nz-button
    nzSize="large"
    nzType="primary"
    jhiTranslate="entity.action.add"
    class="ml-2"
    *jhiHasAnyAuthority="[authority.FAQ_CATEGORY_WRITE]"
    (click)="faqCategoryService.openUpdate()"
  >
    Add
  </button>
</div>

<bm-alert></bm-alert>

<ng-container *ngIf="data?.length">
  <div class="table-responsive">
    <nz-table [nzLoading]="loading" nzSize="small" nzTemplateMode nzOuterBordered>
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" [callback]="loadPage.bind(this)">
          <th jhiSortBy="id">
            <span jhiTranslate="global.field.id">ID</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="active">
            <span jhiTranslate="billMasterGwApp.faqCategory.active">Active</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="name">
            <span jhiTranslate="billMasterGwApp.faqCategory.name">Name</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let faqCategory of data; trackBy: trackId">
          <td>{{ faqCategory.id }}</td>
          <td>{{ faqCategory.active }}</td>
          <td>{{ getI18nText(faqCategory.names) }}</td>
          <td class="text-right" *jhiHasAnyAuthority="[authority.FAQ_CATEGORY_WRITE]">
            <nz-button-group nzSize="small">
              <button nz-button (click)="faqCategoryService.openUpdate(faqCategory)" title="{{ 'entity.action.edit' | translate }}">
                <i nz-icon nzType="edit" class="icon-btn"></i>
              </button>
              <button nz-button (click)="faqCategoryService.openDelete(faqCategory.id)" title="{{ 'entity.action.delete' | translate }}">
                <i nz-icon nzType="delete" class="icon-btn"></i>
              </button>
            </nz-button-group>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>
  <div class="d-flex justify-content-center mt-3">
    <nz-pagination
      [nzPageIndex]="ngbPaginationPage"
      [nzTotal]="totalItems"
      [nzPageSize]="itemsPerPage"
      (nzPageIndexChange)="loadPage($event)"
    ></nz-pagination>
  </div>
</ng-container>
