<form *ngIf="id" (ngSubmit)="cancelPay()">
  <div class="modal-header">
    <h4 class="modal-title" jhiTranslate="billMasterGwApp.pkbillmsTransaction.modalTitle.cancelPay">Confirm cancel
      operation</h4>

    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="close()">&times;</button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>
    <p jhiTranslate="billMasterGwApp.pkbillmsTransaction.question.cancelPay">Are you sure you want to cancel this
      payment?</p>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" nzType="text" jhiTranslate="entity.action.back" data-dismiss="modal"
            (click)="close()">
      Back
    </button>
    <button type="submit" nz-button nzSize="large" nzDanger [nzLoading]="loading">
      {{ 'entity.action.confirm' | translate }}
    </button>
  </div>
</form>
