<form [formGroup]="editForm" (ngSubmit)="onSubmit()">
  <div class="modal-header">
    <h4 class="modal-title" jhiTranslate="billMasterGwApp.pkbillmsPrefix.home.createOrEditLabel">Create or edit a Prefix</h4>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeModal()">&times;</button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsPrefix.field" for="field_fieldName">Field</label>
        <nz-select id="field_fieldName" formControlName="field" nzSize="large" [compareWith]="compareFn" input-validator>
          <nz-option *ngFor="let field of fields" nzLabel="{{prefixService.getRecipientWithFieldColText(field)}}" [nzValue]="field"></nz-option>
        </nz-select>
      </div>

      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsPrefix.type" for="field_type">Type</label>
        <bm-select-input id="field_type" formControlName="type" [data]="type" input-validator></bm-select-input>
      </div>
      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.pkbillmsPrefix.value" for="field_value">Value</label>
        <input nz-input nzSize="large" formControlName="value" id="field_value" maxlength="16" />
      </div>
      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.pkbillmsPrefix.requireField" for="field_requireField">Require Field</label>
        <input nz-input nzSize="large" formControlName="requireField" id="field_requireField" maxlength="64" />
      </div>
    </div>
    <div class="form-group">
      <nz-switch
        id="field_active"
        formControlName="active"
        nzCheckedChildren="{{ 'billMasterGwApp.pkbillmsField.output' | translate }}"
        nzUnCheckedChildren="{{ 'billMasterGwApp.pkbillmsField.output' | translate }}"
      >
      </nz-switch>
      <!--      <label nz-checkbox formControlName="output">{{'billMasterGwApp.pkbillmsPrefix.output' | translate}}</label>-->
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" nzType="text" jhiTranslate="entity.action.cancel" (click)="closeModal()">Cancel</button>
    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
