<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0" jhiTranslate="global.menu.entities.pkbillmsPrefix">Prefixes</h4>

  <div>
    <nz-badge [nzCount]="filterRef.querySize">
      <button nz-button nzSize="large" jhiTranslate="entity.action.filter" (click)="showFilter = !showFilter">Filter</button>
    </nz-badge>

    <ngl-export-as
      *ngIf="data?.length"
      class="ml-2"
      [data]="data"
      requestUrl="{{ prefixService.resourceUrl }}"
      [requestOption]="getOption"
      [exclude]="exclude"
      translationPrefix="billMasterGwApp.pkbillmsPrefix"
      fileName="prefixes"
    >
    </ngl-export-as>

    <button
      class="ml-2"
      type="button"
      nz-button
      nzSize="large"
      nzType="primary"
      jhiTranslate="entity.action.add"
      *jhiHasAnyAuthority="[authority.PREFIX_WRITE]"
      (click)="prefixService.openUpdate()"
    >
      Add
    </button>
  </div>
</div>

<ngl-filter-field [hidden]="!showFilter" [fields]="filterFields" (onFilter)="setQuery($event); loadPage()" #filterRef></ngl-filter-field>

<bm-alert></bm-alert>

<ng-container *ngIf="data?.length">
  <div class="table-responsive">
    <nz-table [nzLoading]="loading" nzSize="small" nzTemplateMode nzOuterBordered>
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" [callback]="loadPage.bind(this)">
          <th jhiSortBy="id">
            <span jhiTranslate="global.field.id">ID</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="field">
            <span jhiTranslate="billMasterGwApp.pkbillmsPrefix.field">Field</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="type">
            <span jhiTranslate="billMasterGwApp.pkbillmsPrefix.type">Type</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="value">
            <span jhiTranslate="billMasterGwApp.pkbillmsPrefix.value">Value</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="requireField">
            <span jhiTranslate="billMasterGwApp.pkbillmsPrefix.requireField">Require Field</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let prefix of data; trackBy: trackId">
          <td>
            <a href="javascript:void(0)" (click)="prefixService.openView(prefix)">{{ prefix.id }}</a>
          </td>
          <td>
            <div *ngIf="prefix.field">
              <a href="javascript:void(0)" (click)="fieldService.openView(prefix.field)">{{
                prefixService.getRecipientWithFieldColText(prefix.field)
              }}</a>
            </div>
          </td>
          <td>{{ prefix.type }}</td>
          <td>{{ prefix.value }}</td>
          <td>{{ prefix.requireField }}</td>
          <td width="10" class="text-right">
            <nz-button-group nzSize="small">
              <button nz-button (click)="prefixService.openHistory(prefix.id)" title="{{ 'entity.action.history' | translate }}">
                <i nz-icon nzType="history" class="icon-btn"></i>
              </button>
              <button nz-button (click)="prefixService.openView(prefix)" title="{{ 'entity.action.view' | translate }}">
                <i nz-icon nzType="eye" class="icon-btn"></i>
              </button>
              <ng-container *jhiHasAnyAuthority="[authority.PREFIX_WRITE]">
                <button nz-button (click)="prefixService.openUpdate(prefix, true)" title="{{ 'entity.action.duplicate' | translate }}">
                  <i nz-icon nzType="copy" class="icon-btn"></i>
                </button>
                <button nz-button (click)="prefixService.openUpdate(prefix)" title="{{ 'entity.action.edit' | translate }}">
                  <i nz-icon nzType="edit" class="icon-btn"></i>
                </button>
                <button nz-button (click)="prefixService.openDelete(prefix.id)" title="{{ 'entity.action.delete' | translate }}">
                  <i nz-icon nzType="delete" class="icon-btn"></i>
                </button>
              </ng-container>
            </nz-button-group>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>

  <div class="d-flex justify-content-center mt-3">
    <nz-pagination
      [nzPageIndex]="ngbPaginationPage"
      [nzTotal]="totalItems"
      [nzPageSize]="itemsPerPage"
      (nzPageIndexChange)="loadPage($event)"
    >
    </nz-pagination>
  </div>
</ng-container>
