<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="mb-0" jhiTranslate="global.menu.entities.pkuaaGroup">User Groups</h5>

  <div>
    <nz-badge [nzCount]="filterRef.querySize">
      <button nz-button nzSize="large" jhiTranslate="entity.action.filter" (click)="showFilter = !showFilter">Filter</button>
    </nz-badge>

    <!--      <button type="button" class="ml-2" nz-button nzSize="large" nzType="primary" jhiTranslate="entity.action.add"-->
    <!--              *jhiHasAnyAuthority="[authority.USER_GROUP_WRITE]" (click)="userGroupService.openUpdate()">-->
    <!--        Add-->
    <!--      </button>-->
  </div>
</div>

<ngl-filter-field [hidden]="!showFilter" [fields]="filterFields" (onFilter)="setQuery($event); loadPage()" #filterRef></ngl-filter-field>

<div class="mb-3" [style.max-width.px]="350">
  <nz-input-group nzSize="large" [nzPrefix]="prefixTemplateUser" [nzSuffix]="searchText ? suffixTemplateInfo : null">
    <input
      nz-input
      placeholder="{{ 'global.form.search.placeholder' | translate }}"
      name="searchText"
      [(ngModel)]="searchText"
      (ngModelChange)="loadPage()"
      auto-focus
    />
  </nz-input-group>
  <ng-template #prefixTemplateUser><i nz-icon nzType="search" class="mr-2"></i></ng-template>
  <ng-template #suffixTemplateInfo>
    <i nz-icon nzType="close-circle" class="cursor-pointer" (click)="searchText = null; loadPage()"></i>
  </ng-template>
</div>

<bm-alert></bm-alert>
