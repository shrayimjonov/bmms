<form [formGroup]="editForm" (ngSubmit)="onSubmit()">
  <div class="modal-header">
    <h5 class="modal-title" jhiTranslate="billMasterGwApp.pkbillmsCategory.home.createOrEditLabel">Create Or Edit Label</h5>

    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeModal()">&times;</button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsCashBack.bankCommission">Bank Commission</label>
        <nz-input-number nzSize="large" formControlName="bankCommission" input-validator></nz-input-number>
      </div>
      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsCashBack.clientCommission">Client Commission</label>
        <nz-input-number nzSize="large" formControlName="clientCommission" input-validator></nz-input-number>
      </div>

      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.pkbillmsCashBack.name">Name</label>
        <input nz-input nzSize="large" formControlName="name" input-validator />
      </div>

      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.pkbillmsCashBack.type">Type</label>
        <bm-select-input formControlName="type" [data]="cashBackType"></bm-select-input>
      </div>

      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.pkbillmsCashBack.status">Status</label>
        <bm-select-input formControlName="status" [data]="cashbackStatus"></bm-select-input>
      </div>

      <div class="form-group col-md-12">
        <json-editor [options]="editorOptions" formControlName="jsonParams"></json-editor>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" nzType="text" jhiTranslate="entity.action.cancel" (click)="closeModal()">Cancel</button>
    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
