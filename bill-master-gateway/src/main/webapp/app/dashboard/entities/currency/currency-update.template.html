<form [formGroup]="editForm" (ngSubmit)="onSubmit()">
  <div class="modal-header">
    <h4 class="modal-title" jhiTranslate="billMasterGwApp.bmmsCurrency.home.createOrEditLabel">Create Or Edit
      Currency</h4>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
            (click)="closeModal()">&times;
    </button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.bmmsCurrency.code" for="field_code">Code</label>
        <input nz-input nzSize="large" formControlName="code" id="field_code" minlength="3" maxlength="3"
               input-validator auto-focus>
      </div>

      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.bmmsCurrency.ccy" for="field_ccy">Ccy</label>
        <input nz-input nzSize="large" formControlName="ccy" id="field_ccy" minlength="3" maxlength="3" input-validator>
      </div>

      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.bmmsCurrency.ccy" for="field_nameRu">Name Ru</label>
        <input nz-input nzSize="large" formControlName="nameRu" id="field_nameRu" maxlength="64" input-validator>
      </div>

      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.bmmsCurrency.rate" for="field_rate">Rate</label>
        <input nz-input nzSize="large" type="number" placeholder="0" formControlName="rate" id="field_rate"
               input-validator>
      </div>

      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.bmmsCurrency.sellRate" for="field_sell_rate">Sell Rate</label>
        <input nz-input nzSize="large" type="number" placeholder="0" formControlName="sellRate" id="field_sell_rate"
               input-validator>
      </div>

      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.bmmsCurrency.buyRate" for="field_buyRate">Buy Rate</label>
        <input nz-input nzSize="large" type="number" placeholder="0" formControlName="buyRate" id="field_buyRate"
               input-validator>
      </div>

      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.bmmsCurrency.ccyGroup" for="field_ccyGroup">Ccy Group</label>
        <bm-select-input id="field_ccyGroup" formControlName="ccyGroup" [data]="groups"
                         [bmOptionOverflowSize]="9" (ngModelChange)="onCcyGroupChange()">
        </bm-select-input>
      </div>

<!--      <div class="form-group col-md-6">-->
<!--        <label jhiTranslate="billMasterGwApp.bmmsCurrency.date" for="field_date">Date</label>-->
<!--        <nz-date-picker formControlName="date" id="field_date" nzSize="large" nzFormat="dd.MM.yyyy"-->
<!--                        nzInputReadOnly></nz-date-picker>-->
<!--      </div>-->

      <input nz-input class="form-group mt-2" id="field_otherCcyGroup" placeholder="Укажите группу вручную..."
             formControlName="otherCcyGroup" *ngIf="isOther()">

      <nz-switch
        class="col-md-12"
        id="field_active"
        formControlName="active"
        nzCheckedChildren="{{ 'global.active.true' | translate }}"
        nzUnCheckedChildren="{{ 'global.active.false' | translate }}">
      </nz-switch>

    </div>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" jhiTranslate="entity.action.cancel" (click)="closeModal()">
      Cancel
    </button>
    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
