<form [formGroup]="editForm" (ngSubmit)="onSubmit()">
  <div class="modal-header">
    <h5 class="modal-title" jhiTranslate="billMasterGwApp.pkbillmsRecipientGroup.home.createOrEditLabel">
      Create or edit a Recipient Group
    </h5>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeModal()">&times;</button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsRecipientGroup.name"
               for="field_name">Name</label>
        <input nz-input nzSize="large" formControlName="name" id="field_name" input-validator auto-focus />
      </div>

      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsRecipientGroup.recipient"
               for="field_recipients">Recipients</label>
        <bm-select-input
          [bmServerSearch]="true"
          [requestUrl]="recipientService.resourceUrl"
          formControlName="recipients"
          id="field_recipients"
          bmMode="multiple"
          bmLabelField="shortName"
          [bmMaxTagCount]="0"
          [bmShowSearch]="true"
          input-validator
        ></bm-select-input>
      </div>
    </div>

    <div class="form-group">
      <label jhiTranslate="billMasterGwApp.pkbillmsRecipientGroup.more" for="field_more">More</label>
      <textarea nz-input nzSize="large" rows="3" formControlName="more" id="field_more" input-validator></textarea>
    </div>

    <nz-switch
      id="field_active"
      formControlName="active"
      nzCheckedChildren="{{ 'global.active.true' | translate }}"
      nzUnCheckedChildren="{{ 'global.active.false' | translate }}">
    </nz-switch>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" nzType="text" jhiTranslate="entity.action.cancel" (click)="closeModal()">Cancel</button>
    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
