<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0" jhiTranslate="global.menu.entities.pkbillmsResponseField">Response Fields</h4>

  <div>
    <nz-badge [nzCount]="filterRef.querySize">
      <button nz-button nzSize="large" jhiTranslate="entity.action.filter" (click)="showFilter = !showFilter">Filter</button>
    </nz-badge>

    <ngl-export-as
      *ngIf="data?.length"
      class="ml-2"
      [data]="data"
      requestUrl="{{ responseFieldService.resourceUrl }}"
      [requestOption]="getOption"
      [exclude]="exclude"
      translationPrefix="global.menu.entities.pkbillmsResponseField"
      fileName="response_fields"
    >
    </ngl-export-as>

    <button
      class="ml-2"
      type="button"
      nz-button
      nzSize="large"
      nzType="primary"
      jhiTranslate="entity.action.add"
      *jhiHasAnyAuthority="[authority.RESPONSE_FIELD_WRITE]"
      (click)="responseFieldService.openUpdate()"
    >
      Add
    </button>
  </div>
</div>

<ngl-filter-field [hidden]="!showFilter" [fields]="filterFields" (onFilter)="setQuery($event); loadPage()" #filterRef></ngl-filter-field>

<bm-alert></bm-alert>

<ng-container *ngIf="data?.length">
  <div class="table-responsive">
    <nz-table [nzLoading]="loading" nzSize="small" nzTemplateMode nzOuterBordered>
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" [callback]="loadPage.bind(this)">
          <th jhiSortBy="id">
            <span jhiTranslate="global.field.id">ID</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="recipientId">
            <span jhiTranslate="billMasterGwApp.pkbillmsResponseField.recipientId">Recipient</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="name">
            <span jhiTranslate="billMasterGwApp.pkbillmsResponseField.name">Name</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="visibility">
            <span jhiTranslate="billMasterGwApp.pkbillmsResponseField.visibility">Visibility</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="ord">
            <span jhiTranslate="billMasterGwApp.pkbillmsResponseField.ord">Ord</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="requestType">
            <span jhiTranslate="billMasterGwApp.pkbillmsResponseField.requestType">Request Type</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="responseType">
            <span jhiTranslate="billMasterGwApp.pkbillmsResponseField.responseType">Response Type</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th jhiSortBy="type">
            <span jhiTranslate="billMasterGwApp.pkbillmsResponseField.type">Type</span>
            <sort-icon icon="sort"></sort-icon>
          </th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let responseField of data; trackBy: trackId">
          <td>
            <a href="javascript:void(0)" (click)="responseFieldService.openView(responseField)">{{ responseField.id }}</a>
          </td>
          <td>{{ responseField.name }}</td>
          <td>{{ responseField.visibility }}</td>
          <td>{{ responseField.ord }}</td>
          <td>{{ responseField.requestType }}</td>
          <td>
            <div *ngIf="responseField.recipient">
              <a href="javascript:void(0)" (click)="recipientService.openView(responseField.recipient)">{{
                responseField.recipient.shortName
              }}</a>
            </div>
          </td>
          <td>{{ responseField.type }}</td>
          <td width="10" class="text-right">
            <nz-button-group nzSize="small">
              <button
                nz-button
                (click)="responseFieldService.openHistory(responseField.id)"
                title="{{ 'entity.action.history' | translate }}"
              >
                <i nz-icon nzType="history" class="icon-btn"></i>
              </button>
              <button
                (click)="responseFieldService.openView(responseField)"
                nzType="default"
                nz-button
                title="{{ 'entity.action.view' | translate }}"
              >
                <i nz-icon nzType="eye" class="icon-btn"></i>
              </button>
              <ng-container *jhiHasAnyAuthority="[authority.RESPONSE_FIELD_WRITE]">
                <button
                  nz-button
                  (click)="responseFieldService.openUpdate(responseField, true)"
                  title="{{ 'entity.action.duplicate' | translate }}"
                >
                  <i nz-icon nzType="copy" class="icon-btn"></i>
                </button>
                <button nz-button (click)="responseFieldService.openUpdate(responseField)" title="{{ 'entity.action.edit' | translate }}">
                  <i nz-icon nzType="edit" class="icon-btn"></i>
                </button>
                <button
                  nz-button
                  (click)="responseFieldService.openDelete(responseField.id)"
                  title="{{ 'entity.action.delete' | translate }}"
                >
                  <i nz-icon nzType="delete" class="icon-btn"></i>
                </button>
              </ng-container>
            </nz-button-group>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>

  <div class="d-flex justify-content-center mt-3">
    <nz-pagination
      [nzPageIndex]="ngbPaginationPage"
      [nzTotal]="totalItems"
      [nzPageSize]="itemsPerPage"
      (nzPageIndexChange)="loadPage($event)"
    >
    </nz-pagination>
  </div>
</ng-container>
