<form [formGroup]="editForm" (ngSubmit)="onSubmit()">
  <div class="modal-header">
    <h4 class="modal-title" jhiTranslate="billMasterGwApp.pkbillmsResponseField.home.createOrEditLabel">Create or edit a Response Field</h4>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeModal()">&times;</button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>

    <div class="form-row">
      <div class="form-group col-md-9">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsResponseField.name" for="field_name">name</label>
        <input nz-input nzSize="large" formControlName="name" id="field_name" input-validator />
      </div>

      <div class="form-group col-md-3">
        <label jhiTranslate="billMasterGwApp.pkbillmsResponseField.ord" for="field_ord">ord</label>
        <input nz-input nzSize="large" formControlName="ord" id="field_ord" type="number" input-validator />
      </div>
      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.pkbillmsResponseField.visibility" for="field_visibility">visibility</label>
        <bm-select-input [data]="visibilities" formControlName="visibility" id="field_visibility"></bm-select-input>
      </div>
      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.pkbillmsResponseField.requestType" for="field_requestType">requestType</label>
        <bm-select-input [data]="requestTypes" formControlName="requestType" id="field_requestType"></bm-select-input>
      </div>
      <div class="form-group col-md-6">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsResponseField.recipientId" for="field_recipient"
          >recipient</label
        >
        <bm-select-input
          [bmServerSearch]="true"
          [bmShowSearch]="true"
          [requestUrl]="recipientService.resourceUrl"
          formControlName="recipient"
          id="field_recipient"
          bmLabelField="shortName"
          input-validator
        ></bm-select-input>
      </div>
      <div class="form-group col-md-6">
        <label jhiTranslate="billMasterGwApp.pkbillmsResponseField.type" for="field_type">Type</label>
        <bm-select-input [data]="types" formControlName="type" id="field_type"></bm-select-input>
      </div>
      <div class="form-group col-md-12" *ngIf="isTypeOfAmount()">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsAgent.amountRatio" for="field_amountRatio">Amount Ratio</label>
        <bm-select-input
          id="field_amountRatio"
          [data]="amountRatios"
          bmLabelField="label"
          bmValueField="value"
          formControlName="amountRatio"
          input-validator
        >
        </bm-select-input>
      </div>
      <div class="form-group col-md-12">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsResponseField.labels">labels</label>
        <bm-i18n-input formControlName="labels" [duplicate]="duplicate" input-validator></bm-i18n-input>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" nzType="text" jhiTranslate="entity.action.cancel" (click)="closeModal()">Cancel</button>
    <button nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
