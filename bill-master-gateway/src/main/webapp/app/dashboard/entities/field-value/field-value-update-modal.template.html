<form [formGroup]="editForm" (ngSubmit)="onSubmit()">
  <div class="modal-header">
    <h3 class="modal-title" jhiTranslate="billMasterGwApp.pkbillmsFieldValue.home.createOrEditLabel">Create or edit a Field Value</h3>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeModal()">&times;</button>
  </div>

  <div class="modal-body">
    <bm-alert></bm-alert>

    <div class="form-row">
      <div class="form-group col-md-7">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsFieldValue.field" for="field_fieldName">Field</label>
        <nz-select
          id="field_fieldName"
          formControlName="field"
          nzSize="large"
          nzShowSearch
          nzServerSearch
          [compareWith]="compareFn"
          (nzOnSearch)="onFieldSearch($event)"
          input-validator
        >
          <nz-option
            *ngFor="let field of fields"
            nzLabel="{{ field.name }} - {{ field.recipient?.shortName }}"
            [nzValue]="field"
          ></nz-option>
        </nz-select>
      </div>
      <div class="form-group col-md-5">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsFieldValue.value" for="field_value">Value</label>
        <input nz-input nzSize="large" formControlName="value" id="field_value" input-validator />
      </div>
      <div class="form-group col-md-5">
        <label jhiTranslate="billMasterGwApp.pkbillmsFieldValue.filterBy" for="field_value">FilterBy</label>
        <input nz-input nzSize="large" formControlName="filterBy" id="field_filterBy" />
      </div>
      <div class="form-group col-md-4">
        <label jhiTranslate="billMasterGwApp.pkbillmsFieldValue.amount" for="field_amount">Amount</label>
        <input nz-input nzSize="large" formControlName="amount" id="field_amount" mask="separator.2" autocomplete="off" />
      </div>
      <div class="form-group col-md-3">
        <label jhiTranslate="billMasterGwApp.pkbillmsFieldValue.ord" for="field_ord">Ord</label>
        <input nz-input nzSize="large" formControlName="ord" id="field_ord" type="number" />
      </div>

      <div class="form-group col-md-12">
        <label class="label-required" jhiTranslate="billMasterGwApp.pkbillmsFieldValue.title">titles</label>
        <bm-i18n-input formControlName="titles" [duplicate]="duplicate" input-validator></bm-i18n-input>
      </div>
      <div class="col-md-12">
        <label jhiTranslate="billMasterGwApp.pkbillmsFieldValue.description">descriptions</label>
        <bm-i18n-input formControlName="descriptions" [duplicate]="duplicate"></bm-i18n-input>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" nz-button nzSize="large" nzType="text" jhiTranslate="entity.action.cancel" (click)="closeModal()">Cancel</button>
    <button type="submit" nz-button nzSize="large" nzType="primary" [nzLoading]="loading" [input-validator-button]="editForm">
      {{ 'entity.action.save' | translate }}
    </button>
  </div>
</form>
