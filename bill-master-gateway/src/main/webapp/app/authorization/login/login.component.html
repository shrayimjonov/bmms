<div class="d-flex justify-content-center p-4">
  <div class="login__container rounded card-box-shadow">
    <h4 class="mb-4 font-weight-bold" jhiTranslate="login.title">Sign In</h4>

    <bm-alert></bm-alert>

    <form class="mb-4" [formGroup]="editForm" (ngSubmit)="login()">
      <div class="form-group-lg">
        <label jhiTranslate="global.form.username.label">Login</label>
        <input nz-input nzSize="large" formControlName="username" auto-focus />
      </div>

      <div class="form-group-lg">
        <label jhiTranslate="login.form.password">Password</label>
        <bm-password-input formControlName="password"></bm-password-input>
      </div>

      <div class="form-group-lg">
        <label nz-checkbox formControlName="rememberMe">
          <span jhiTranslate="login.form.rememberme">Remember me</span>
        </label>
      </div>

      <button nz-button type="submit" [nzLoading]="loading" nzType="primary" nzSize="large">{{ 'login.form.button' | translate }}</button>
    </form>

    <div class="mt-3 alert alert-warning">
      <a class="alert-link" (click)="requestResetPassword()" jhiTranslate="login.password.forgot">Did you forget your password?</a>
    </div>

    <div class="alert alert-warning mb-0">
      <span jhiTranslate="global.messages.info.register.noaccount">You don't have an account yet?</span>
      <a class="alert-link" routerLink="../register" jhiTranslate="global.messages.info.register.link">Register a new account</a>
    </div>
  </div>
</div>
